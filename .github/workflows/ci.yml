name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── Check + lint + test ───────────────────────────────────────────────────
  check:
    name: Check & Clippy & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --locked

      - name: cargo clippy — deny warnings
        run: cargo clippy --locked -- -D warnings

      - name: cargo fmt — check formatting
        run: cargo fmt --check

      - name: cargo test
        run: cargo test --locked

  # ── Release build (matrix: Linux x86_64, macOS arm64, Windows x86_64) ────
  build:
    name: Build (${{ matrix.target }})
    needs: check
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: depick
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: depick
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: depick.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: depick-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}
          retention-days: 7

  # ── Publish to crates.io — only on version tags ───────────────────────────
  publish:
    name: Publish to crates.io
    needs: [check, build]
    runs-on: ubuntu-latest
    # Only runs when a tag like v0.1.0 is pushed
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: crates-io
      url: https://crates.io/crates/depick

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: Swatinem/rust-cache@v2

      - name: Verify crate version matches git tag
        shell: bash
        run: |
          CARGO_VERSION="v$(cargo metadata --no-deps --format-version 1 \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['packages'][0]['version'])")"
          GIT_TAG="${GITHUB_REF#refs/tags/}"
          echo "Cargo version : $CARGO_VERSION"
          echo "Git tag       : $GIT_TAG"
          if [ "$CARGO_VERSION" != "$GIT_TAG" ]; then
            echo "::error::Cargo.toml version ($CARGO_VERSION) does not match git tag ($GIT_TAG)"
            exit 1
          fi

      - name: Publish
        run: cargo publish --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
